name: Inorysekiro2333/dsh-ide-mode
category: ui
description:
  en: 'Adds an IDE mode button to the conversation header: one click turns the main panel into a three-column workspace with a file tree, an editable CodeMirror 6 code area that saves with Ctrl+S, and the live conversation.'
  zh: '在会话标题栏加一个 IDE 模式按钮：一键把主面板换成三栏工作区——文件树、用 Ctrl+S 保存的 CodeMirror 6 代码区、以及实时对话。'
